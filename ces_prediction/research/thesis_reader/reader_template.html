;padding:1px 3px;vertical-align:baseline}.document-link{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:5px;font-size:13px}.library{max-width:1150px;margin:auto}.library-heading{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}.library-heading p{margin:0;color:var(--muted);font-size:13px}.library-controls{display:grid;grid-template-columns:minmax(180px,1fr) 170px 170px;gap:10px;margin-bottom:18px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:10px 12px;width:100%;min-height:42px}.library-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:7px 0 12px}.source-list{display:grid;gap:0;background:var(--paper);border-top:1px solid var(--line)}.source-row{display:grid;grid-template-columns:40px minmax(0,1fr) 100px;gap:12px;padding:19px 18px;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:start}.source-number{font-size:11px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}.source-title{font-family:Georgia,"Batang",serif;font-size:16px;line-height:1.4;display:block;margin-bottom:6px}.source-byline{color:var(--muted);font-size:11px;line-height:1.55;display:block}.source-key{color:var(--muted);font-size:10px;display:block;margin-top:5px;overflow-wrap:anywhere}.reading-badge{font-size:10px;display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:4px;line-height:1.3;color:var(--muted);justify-self:end;white-space:nowrap}.reading-badge.full_pdf{color:var(--accent);background:var(--soft);border-color:transparent}.reading-badge.full_text{color:var(--blue)}.empty{padding:50px 20px;color:var(--muted);text-align:center}.footer-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;margin-top:25px}.source-dialog{border:1px solid var(--line);border-radius:8px;max-width:780px;width:calc(100% - 28px);max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);box-shadow:0 24px 90px #0003;padding:0}.source-dialog::backdrop{background:#15272370}.dialog-top{padding:20px 25px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;background:var(--paper);z-index:2}.dialog-top span{font-size:11px;color:var(--muted)}.close-button{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:4px}.dialog-content{padding:25px 30px 32px;overflow-wrap:anywhere}.dialog-content h2{font-family:Georgia,"Batang",serif;font-size:23px;line-height:1.4;margin-bottom:12px}.dialog-content h3{font-size:14px;margin:26px 0 10px}.dialog-content p,.dialog-content li{font-size:13px}.dialog-content details{border-bottom:1px solid var(--line);padding:13px 0}.dialog-content summary{font-size:13px;font-weight:600;cursor:pointer}.dialog-content .source-meta{font-size:12px;color:var(--muted)}.claim-note{padding-left:13px;border-left:3px solid var(--soft);margin-top:14px}.locator{font-size:11px;color:var(--muted);font-family:"Segoe UI","Malgun Gothic",sans-serif}.source-links{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.source-links a{border:1px solid var(--line);padding:7px 10px;border-radius:4px;font-size:12px}.dialog-content pre{white-space:pre-wrap;font-size:11px;background:var(--bg);padding:13px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<header class="site-header">
<div class="topbar"><div><div class="eyebrow">Research manuscript · source notebook</div><h1><!--TITLE--></h1><p class="subtitle"><!--SUBTITLE--></p></div>
<div class="header-actions"><button type="button" class="view-button" data-view="paper" aria-pressed="true">원고 읽기</button><button type="button" class="view-button" data-view="library" aria-pressed="false">문헌·인용 근거</button><button type="button" class="quiet" id="print-button">인쇄</button></div></div>
<div class="stats" id="stats" aria-label="문헌 검토 상태"></div>
</header>
<div class="shell"><aside class="sidebar" aria-label="원고 절별 이동"><div class="sidebar-inner"><p class="nav-label">CONTENTS</p><!--SECTION_NAV--><p class="nav-help">인용 표기를 누르면<br>원문과 확인 근거를<br>함께 볼 수 있습니다.</p></div></aside>
<main class="content" id="main-content">
<article class="paper-view" id="paper-view"><p class="status-note"><!--STATUS_NOTE--></p><!--MANUSCRIPT--></article>
<section class="library" id="library-view" hidden aria-labelledby="library-title"><div class="library-heading"><h2 id="library-title">문헌과 인용 근거</h2><p>보관·요약 선별·전체 추출문·전체 PDF 검토를 구분합니다.</p></div>
<div class="library-controls"><div class="field search-field"><label for="source-search">제목·저자·연도·키 검색</label><input id="source-search" type="search" placeholder="예: NN-CES, Pastore, ion temperature" autocomplete="off"></div><div class="field"><label for="mode-filter">읽기 범위</label><select id="mode-filter"><option value="all">전체</option><option value="full_pdf">전체 PDF</option><option value="full_text">전체 추출문</option><option value="summary">목록·요약 선별</option><option value="held">외부 검토 보류</option><option value="duplicate">중복 보관본</option></select></div><div class="field"><label for="relevance-filter">검토상 관련성</label><select id="relevance-filter"><option value="all">전체</option><option value="direct">직접 관련</option><option value="supporting">배경 근거</option><option value="peripheral">주변 문헌</option><option value="unsuitable">채택하지 않음</option></select></div></div>
<div class="library-meta"><span id="visible-count" role="status" aria-live="polite"></span><span>제목순</span></div><div class="source-list" id="source-list"></div>
<p class="footer-note">이 화면은 생성 시점의 로컬 검토 기록입니다. ‘전체 추출문’은 페이지 그림을 제공하지 않은 본문 검토이며, 도표의 시각적 확인과 같지 않습니다. 문헌 감사는 논문 전체의 독립 채점이나 실험 결과 검증을 대신하지 않습니다.</p></section>
</main></div>
<dialog id="source-dialog" class="source-dialog" aria-labelledby="source-dialog-title"><div class="dialog-top"><span id="dialog-key"></span><button type="button" class="close-button" id="close-dialog">닫기</button></div><div class="dialog-content" id="dialog-content"></div></dialog>
<script>
'use strict';
const DATA = /*READER_DATA*/;
const sourceByKey = new Map(DATA.sources.map(s=>[s.key,s]));
const paperView=document.getElementById('paper-view'),libraryView=document.getElementById('library-view');
const search=document.getElementById('source-search'),modeFilter=document.getElementById('mode-filter'),relevanceFilter=document.getElementById('relevance-filter');
const sourceList=document.getElementById('source-list'),dialog=document.getElementById('source-dialog');
let lastFocus=null;
const E=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined&&text!==null)el.textContent=String(text);if(cls)el.className=cls;return el};
const text=v=>v===undefined||v===null?'':typeof v==='object'?JSON.stringify(v):String(v);
const paragraphs=(parent,value)=>{if(!value)return;const values=Array.isArray(value)?value:[value];for(const v of values){if(typeof v==='object'){for(const [k,z] of Object.entries(v)){const p=E('p');p.append(E('strong',k+': '),document.createTextNode(text(z)));parent.append(p)}}else parent.append(E('p',v))}};
function setView(view){const isPaper=view==='paper';paperView.hidden=!isPaper;libraryView.hidden=isPaper;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(!isPaper)renderSources()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('.section-nav').forEach(b=>b.addEventListener('click',()=>{setView('paper');document.getElementById(b.dataset.section)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});document.querySelectorAll('.section-nav').forEach(n=>n.classList.toggle('active',n===b))}));
document.querySelector('.section-nav')?.classList.add('active');
document.getElementById('print-button').addEventListener('click',()=>{setView('paper');document.querySelectorAll('.pdf-preview').forEach(d=>d.open=true);window.print()});
function renderStats(){const counts={};for(const s of DATA.sources)counts[s.mode]=(counts[s.mode]||0)+1;const stats=[['보관 PDF',DATA.sources.length],['전체 PDF',counts.full_pdf||0],['전체 추출문',counts.full_text||0],['목록·요약',counts.summary||0]];for(const [label,value]of stats){const item=E('span');item.append(E('strong',value),document.createTextNode(label));document.getElementById('stats').append(item)}}
function renderSources(){const query=search.value.toLowerCase().trim();const list=DATA.sources.filter(s=>(modeFilter.value==='all'||s.mode===modeFilter.value)&&(relevanceFilter.value==='all'||s.relevance.toLowerCase().includes(relevanceFilter.value))&&(!query||[s.title,s.authors,s.year,s.key,s.doi,JSON.stringify(s.review||{})].join(' ').toLowerCase().includes(query))).sort((a,b)=>a.title.localeCompare(b.title));sourceList.replaceChildren();document.getElementById('visible-count').textContent=list.length+' / '+DATA.sources.length+'개';list.forEach((s,i)=>{const row=E('button',null,'source-row');row.type='button';row.dataset.key=s.key;row.setAttribute('aria-label',s.title+' 인용 근거 보기');row.append(E('span','['+s.number+']','source-number'));const info=E('span');info.append(E('span',s.title,'source-title'),E('span',[s.authors,s.year,s.pages?s.pages+'쪽':''].filter(Boolean).join(' · '),'source-byline'));row.append(info,E('span',s.mode_label,'reading-badge '+s.mode));row.addEventListener('click',()=>showSource(s.key));sourceList.append(row)});if(!list.length)sourceList.append(E('p','검색 조건에 맞는 문헌이 없습니다.','empty'))}
[search,modeFilter,relevanceFilter].forEach(el=>el.addEventListener(el===search?'input':'change',renderSources));
function addSection(body,title,value){if(!value||(Array.isArray(value)&&!value.length))return;const details=E('details');details.append(E('summary',title));paragraphs(details,value);body.append(details)}
function showSource(alias){const key=DATA.aliases[alias]||alias;const s=sourceByKey.get(key);lastFocus=document.activeElement;const body=document.getElementById('dialog-content');body.replaceChildren();document.getElementById('dialog-key').textContent=key;if(!s){const heading=E('h2','인용 기록 연결 확인 중');heading.id='source-dialog-title';body.append(heading,E('p','이 키와 연결된 원문 검토 기록이 아직 없습니다: '+alias));dialog.showModal();return}body.append(E('h2',s.title));body.firstChild.id='source-dialog-title';body.append(E('p',[s.authors,s.year].filter(Boolean).join(' · '),'source-meta'),E('span',s.mode_label,'reading-badge '+s.mode));const links=E('div',null,'source-links');if(s.doi){const a=E('a','출판 원문 · DOI');a.href='https://doi.org/'+s.doi;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}if(s.path){const a=E('a','로컬 PDF 열기');a.href=s.path;a.target='_blank';a.rel='noopener';links.append(a)}if(s.review_file){const a=E('a','검토 기록 JSON');a.href=s.review_file;a.target='_blank';a.rel='noopener';links.append(a)}body.append(links);const r=s.review;if(!r){body.append(E('p',s.mode==='held'?'기관 가이드는 공개 문헌 여부 확인 전 외부 API 전송을 보류했습니다.':s.mode==='duplicate'?'동일 본문의 다른 보관본입니다. 독립적인 선행연구로 중복 집계하지 않습니다.':'문헌 목록·요약 선별 단계입니다. 원문 확인 완료로 해석하지 않습니다.'));dialog.showModal();return}const checks=r.claim_checks||r.claims||[];if(checks.length){body.append(E('h3','이 원문에서 확인한 주장과 위치'));for(const c of checks){const block=E('div',null,'claim-note');block.append(E('p',c.allowed_intro_sentence||c.proposed_claim||c.claim||c.source_finding));if(c.source_finding)block.append(E('p',c.source_finding));if(c.locator||c.source_locator||c.pdf_locator)block.append(E('p',c.locator||c.source_locator||c.pdf_locator,'locator'));if(c.qualification||c.limit)block.append(E('p',c.qualification||c.limit));if(c.verdict)block.append(E('span',c.verdict,'status'));body.append(block)}}addSection(body,'서지 확인 메모',r.visible_trailing_response_note);addSection(body,'실제 질문·방법·근거',r.own_question||r.actual_method_and_evidence);addSection(body,'입력·표적·시간 정보',r.input_target_timing||r.input_target_timing_if_relevant);addSection(body,'검증 범위',r.validation||r.validation_if_relevant);addSection(body,'계산 시간과 실제 운용의 구분',r.runtime_or_deployment);addSection(body,'이 논문만으로 말할 수 없는 것',r.forbidden_inferences);addSection(body,'원고 채택 판단',r.reason_to_include_or_exclude||r.competing_or_complementary);if(s.mode==='full_text')body.append(E('p','페이지별 전체 추출문을 제공한 검토입니다. 그림의 시각적 판독을 수행한 것으로 표시하지 않습니다.','footer-note'));dialog.showModal()}
document.addEventListener('click',event=>{const button=event.target.closest('[data-source]');if(button)showSource(button.dataset.source)});
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
dialog.addEventListener('close',()=>lastFocus?.focus());
window.addEventListener('beforeprint',()=>document.querySelectorAll('.pdf-preview').forEach(d=>d.open=true));
renderStats();renderSources();
window.readerTest={sourceCount:DATA.sources.length,sectionCount:DATA.section_ids.length,showSource,setView};
</script>
</body>
</html>
