[project]
name = "kstar-ces-prediction"
version = "0.1.0"
description = "KSTAR CES multimodal prediction training pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Plotting for peak_analysis figures only. NEVER a core dependency: the figure
# code lazily imports matplotlib (Agg backend) and is skippable with --no-figures.
viz = [
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ces_prediction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
