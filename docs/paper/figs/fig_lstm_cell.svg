<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="LSTM 셀 하나. 입력 x_t와 이전 은닉 상태 h_{t−1}를 이어 붙여 네 개의 선형 사상에 넣고, 시그모이드로 forget 게이트 f, input 게이트 i, output 게이트 o를, tanh로 후보 g를 만든다. 셀 상태는 c_t = f⊙c_{t−1} + i⊙g로 곱해서 잊고 더해서 쓴다. 은닉 상태는 h_t = o⊙tanh(c_t). 이 모델에서 실측된 forget 게이트의 기하평균은 0.47로 기억 1.3스텝이며, Mirnov 열의 가중치 성장은 forget 게이트 행에 몰려 있다." style="max-width:100%;height:auto;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <g stroke="currentColor" fill="none" stroke-width="1.4">
    <!-- cell boundary -->
    <rect x="200" y="60" width="700" height="380" rx="10" stroke-dasharray="5 4" opacity="0.6"/>
    <!-- cell state line c_{t-1} -> c_t (top) -->
    <path d="M60,120 L470,120" marker-end="url(#ah2)"/>
    <path d="M510,120 L670,120" marker-end="url(#ah2)"/>
    <path d="M710,120 L1040,120" marker-end="url(#ah2)"/>
    <circle cx="490" cy="120" r="20"/>
    <circle cx="690" cy="120" r="20"/>
    <!-- hidden state line h_{t-1} (bottom) -->
    <path d="M60,400 L240,400" marker-end="url(#ah2)"/>
    <!-- concat box -->
    <rect x="240" y="300" width="60" height="130" rx="4"/>
    <!-- x_t into concat -->
    <path d="M270,480 L270,430" marker-end="url(#ah2)"/>
    <!-- gates -->
    <rect x="360" y="220" width="90" height="40" rx="4"/>
    <rect x="360" y="280" width="90" height="40" rx="4"/>
    <rect x="360" y="340" width="90" height="40" rx="4"/>
    <rect x="620" y="340" width="90" height="40" rx="4"/>
    <!-- concat -> gates -->
    <path d="M300,330 L330,330 L330,240 L360,240" marker-end="url(#ah2)"/>
    <path d="M300,330 L330,330 L330,300 L360,300" marker-end="url(#ah2)"/>
    <path d="M300,330 L330,330 L330,360 L360,360" marker-end="url(#ah2)"/>
    <path d="M300,330 L330,330 L330,460 L600,460 L600,360 L620,360" marker-end="url(#ah2)"/>
    <!-- f -> multiply on c -->
    <path d="M450,240 L490,240 L490,140" marker-end="url(#ah2)"/>
    <!-- i, g -> multiply -> add -->
    <circle cx="560" cy="300" r="16"/>
    <path d="M450,300 L544,300" marker-end="url(#ah2)"/>
    <path d="M450,360 L560,360 L560,316" marker-end="url(#ah2)"/>
    <path d="M576,300 L690,300 L690,140" marker-end="url(#ah2)"/>
    <!-- tanh(c_t) -> multiply with o -> h_t -->
    <rect x="760" y="200" width="90" height="40" rx="4"/>
    <path d="M805,120 L805,200" marker-end="url(#ah2)"/>
    <circle cx="805" cy="300" r="16"/>
    <path d="M805,240 L805,284" marker-end="url(#ah2)"/>
    <path d="M710,360 L805,360 L805,316" marker-end="url(#ah2)"/>
    <path d="M821,300 L1040,300" marker-end="url(#ah2)"/>
    <path d="M900,300 L900,400 L1040,400" marker-end="url(#ah2)"/>
  </g>
  <g fill="currentColor">
    <!-- operators -->
    <text x="490" y="125" text-anchor="middle" font-size="18">⊙</text>
    <text x="690" y="125" text-anchor="middle" font-size="18">⊕</text>
    <text x="560" y="305" text-anchor="middle" font-size="16">⊙</text>
    <text x="805" y="305" text-anchor="middle" font-size="16">⊙</text>
    <!-- gate labels -->
    <text x="405" y="245" text-anchor="middle" font-weight="600">σ · f_t</text>
    <text x="405" y="305" text-anchor="middle" font-weight="600">σ · i_t</text>
    <text x="405" y="365" text-anchor="middle" font-weight="600">tanh · g_t</text>
    <text x="665" y="365" text-anchor="middle" font-weight="600">σ · o_t</text>
    <text x="805" y="225" text-anchor="middle" font-weight="600">tanh</text>
    <text x="270" y="370" text-anchor="middle" font-size="12">[x_t ; h_{t−1}]</text>
    <!-- state labels -->
    <text x="60" y="108" font-size="12">c_{t−1} (셀 상태 160)</text>
    <text x="1040" y="108" text-anchor="end" font-size="12">c_t</text>
    <text x="60" y="388" font-size="12">h_{t−1} (은닉 상태 160)</text>
    <text x="1040" y="288" text-anchor="end" font-size="12">h_t → LayerNorm → head</text>
    <text x="1040" y="388" text-anchor="end" font-size="12">h_t → 다음 스텝</text>
    <text x="270" y="500" text-anchor="middle" font-size="12">x_t (입력 22 또는 층 1의 h_t 160)</text>
    <!-- equations -->
    <text x="212" y="86" font-size="12" opacity="0.85">f_t, i_t, o_t = σ(W[x_t; h_{t−1}] + b) · g_t = tanh(W_g[x_t; h_{t−1}] + b_g) · c_t = f_t ⊙ c_{t−1} + i_t ⊙ g_t · h_t = o_t ⊙ tanh(c_t)</text>
    <!-- measured annotations -->
    <text x="490" y="172" text-anchor="middle" font-size="11.5" fill="#5e35b1">∂c_t/∂c_{t−1} = f_t → 기울기가 곱으로 쌓이지 않음</text>
    <text x="490" y="188" text-anchor="middle" font-size="11.5" fill="#5e35b1">실측 f 기하평균 0.465–0.482 → 기억 1.3스텝(13 ms), τ > 5스텝 단위 0/320</text>
    <text x="405" y="212" text-anchor="middle" font-size="11" fill="#b71c1c">Mirnov 열의 가중치 성장은 이 행(f)에 몰림: 0.58 → 0.97 (BES 0.59 → 0.71)</text>
  </g>
</svg>
